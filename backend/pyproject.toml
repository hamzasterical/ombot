[project]
name = "ombot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai>=3.32.0",
    "pydantic-settings>=2.16.0",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults
